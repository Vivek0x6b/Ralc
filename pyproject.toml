[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ralc"
version = "0.0.1"
description = "Relational Context Allocation: a model-agnostic context optimization engine for LLM applications."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vivek Bisht" }]
keywords = ["llm", "context", "retrieval", "graph", "rag", "token-budget"]
dependencies = [
    "networkx",
    "numpy",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers",
]
dev = [
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["ralc"]
